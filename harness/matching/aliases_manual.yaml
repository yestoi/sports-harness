# {sport: {source: {raw_name: espn_team_id}}}. raw_name is normalized before lookup.
# The kalshi_name entries below cover real Kalshi event-title conventions observed in a
# live seed-teams/tick-once/match-report run against the harness_test DB on 2026-09-06.
# Note: Kalshi SPREAD/TOTAL event titles are "<team> vs <team>: Spread" / ": Total" --
# harness/matching/kalshi.py::parse_event_title strips that suffix before team-name
# resolution, so plain location/display-name aliases (already seeded from ESPN) cover
# those markets; no separate ": Spread"/": Total" aliases are needed here.
nfl:
  kalshi_name:
    "New York J": 20                   # ESPN: New York Jets -- Kalshi truncates the nickname
    "New York G": 19                   # ESPN: New York Giants
    "JAC Jaguars": 30                  # Kalshi abbreviates Jacksonville JAC, ESPN JAX
    "WAS Commanders": 28               # Kalshi abbreviates Washington WAS, ESPN WSH
ncaaf:
  kalshi_name:
    "Appalachian St.": 2026            # ESPN: App State Mountaineers
    "Louisiana-Monroe": 2433           # ESPN: UL Monroe Warhawks
    "Miami (FL)": 2390                 # ESPN: Miami Hurricanes (distinct from Miami (OH) RedHawks, id 193)
    "Central Connecticut St.": 2115    # ESPN: Central Connecticut Blue Devils
    "Grambling St.": 2755              # ESPN: Grambling Tigers
    "Southern University": 2582        # ESPN: Southern Jaguars
    "University at Albany": 399        # ESPN: UAlbany Great Danes
    "Southeastern Louisiana": 2545     # ESPN: SE Louisiana Lions
    "Tennessee-Martin": 2630           # ESPN: UT Martin Skyhawks
    "Nicholls St.": 2447               # ESPN: Nicholls Colonels
    "LIU": 2341                        # ESPN: Long Island University Sharks
  odds_api:
    "Appalachian State Mountaineers": 2026   # ESPN: App State Mountaineers
    "Hawaii Rainbow Warriors": 62                 # ESPN: Hawai'i Rainbow Warriors
    "Southern Mississippi Golden Eagles": 2572    # ESPN: Southern Miss Golden Eagles
    "Sam Houston State Bearkats": 2534            # ESPN: Sam Houston Bearkats
    "Grambling State Tigers": 2755                # ESPN: Grambling Tigers
    "Southern University Jaguars": 2582           # ESPN: Southern Jaguars
    "UMass Minutemen": 113                        # ESPN: Massachusetts Minutemen
