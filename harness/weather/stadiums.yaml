# Stadium coordinates and roof type, one row per team on harness/weather/roster.txt.
#
# Written from public sources; `source` is the page the coordinates came from and is part of
# the row, not a comment, so a later reader can check one number without re-deriving the table.
#
# NFL rows (nfl:<team_id>) are hand-verified against each stadium's Wikipedia article.
# NCAAF rows (ncaaf:<team_id>) are bulk-sourced from a maintained public geocoded dataset of
# FBS/FCS stadiums (Geoff Boeing's ncaa-football-stadiums repository, itself built from public
# team/venue pages), with two hand overrides: UNLV (the dataset's row is the stadium UNLV
# vacated in 2020) and Idaho/North Dakota's roof (both play in an enclosed arena the dataset
# does not classify).
#
# `roof` decides whether the game is fetched at all (addendum §1.2, D2):
#   open        -- fetched
#   retractable -- fetched and labelled, because a closed roof over a 40-degree forecast is a
#                  different game from an open one and only the label distinguishes them
#   dome        -- never fetched, and never given a weather_points row
#
# A team that plays at a shared or a rotating site, or whose coordinates could not be
# established, belongs in stadiums_missing.txt with a reason instead. Neutral-site games
# override this table per game in neutral_sites.yaml.
