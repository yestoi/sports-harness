<body>
<div class="demo"><strong>DESIGN CONCEPT</strong> · Fictional games, scores, prices & activity · No live data or real bets</div>
<header><div class="brand"><span class="brand-icon" aria-hidden="true">h</span>harness<span style="color:var(--lime)">.</span></div><nav class="nav" aria-label="Main navigation"><button data-page="today">Today</button><button data-page="tickets">My tickets</button><button data-page="room">Game room</button></nav><button class="system-button" data-action="system"><span class="dot"></span>System · paper</button></header>
<main class="page" id="app" tabindex="-1"></main>
<noscript><p class="noscript">Enable JavaScript to explore this interactive design concept.</p></noscript>
<dialog id="detail"><div class="dialog-header"><div><div class="eyebrow" id="dialog-kicker">A closer look</div><h2 id="dialog-title"></h2></div><button class="close" aria-label="Close dialog" data-action="close">×</button></div><div id="dialog-body"></div></dialog>
<script>
'use strict';
// All values below are authored demo fixtures, isolated from the production application.
const state={page:'today',stage:'live',ticketView:'follow',ticketKind:'across',exposure:true,recorded:false,stake:25,odds:600,notice:'',sgpLegs:['win','pass','rec'],sgpQuote:450,sgpFrame:0};
const app=document.getElementById('app');
const modal=document.getElementById('detail');
modal.setAttribute('aria-labelledby','dialog-title');
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n);
const totalReturn=(stake,odds)=>stake*(odds>0?1+odds/100:1+100/Math.abs(odds));
const oddsText=n=>n>0?'+'+n:String(n);
const isPre=()=>state.stage==='pregame';
const isFinal=()=>state.stage==='final';
const stageButtons=()=>`<div><span class="scenario-label">Explore a moment</span><div class="scenario" role="group" aria-label="Demo game scenario">${[['pregame','Before games'],['live','Live'],['final','Final']].map(([s,t])=>`<button data-stage="${s}" aria-pressed="${state.stage===s}">${t}</button>`).join('')}</div></div>`;
function pageTop(title,sub){return `<div class="topline"><div><div class="eyebrow">Your weekend, in play · Sample slate</div><h1>${title}</h1><p class="muted standfirst">${sub}</p></div>${stageButtons()}</div>`;}
function hero(room=false){return `<section class="card hero" aria-label="LSU versus Florida sample game"><div class="hero-top row between"><span class="badge purple">★ YOUR TIGERS</span><span class="small muted">${isPre()?'Kickoff · 6:30 PM CT':isFinal()?'FINAL · SAMPLE RESULT':'LIVE · SAMPLE FEED'}</span></div><div class="scoreboard"><div><div class="crest">LSU</div><div class="team-name">LSU</div><div class="team-meta">Tigers</div></div><div><div class="score">${isPre()?'vs':isFinal()?'31 : 24':'24 : 21'}</div><div class="clock">${isPre()?'SATURDAY NIGHT':isFinal()?'END OF GAME':'Q4 · 08:42'}</div></div><div><div class="crest fl">FLA</div><div class="team-name">Florida</div><div class="team-meta">Gators</div></div></div>${!isPre()&&!isFinal()?'<div class="field" role="img" aria-label="Sample possession: LSU ball at the Florida 35, second and six"><div class="ball-marker"><span>2nd & 6</span></div></div><div class="field-caption"><span>LSU ball · Florida 35</span><button class="link-button" style="padding:0;font-size:10px" data-action="sync">TV sync concept ↗</button></div>':''}<div class="hero-bottom"><div><div class="eyebrow">${isPre()?'A game with a personal stake':isFinal()?'Your final leg':'YOUR FINAL LEG · LSU −3.5'}</div><p>${isPre()?'The anchor for your Saturday ticket.':isFinal()?'LSU won by 7. Your −3.5 leg wins.':'Up by 3. Needs to win by 4 or more.'}</p></div><button class="${room?'secondary':'primary'}" data-${room?'action="why-leg"':'page="room"'}>${room?'Leg details':'Open game'} <span aria-hidden="true">↗</span></button></div></section>`;}
function ticketSlip(compact=false){const proposed=isPre()&&!state.recorded;return `<section class="card ticket"><div class="ticket-head"><div class="row between"><span class="badge">${proposed?'TICKET IDEA':'FUN MONEY · SAMPLE SLIP'}</span><span class="small muted">3 legs · ${oddsText(state.odds)}</span></div><h2 class="ticket-title">A Saturday with LSU.</h2><p class="ticket-sub">${proposed?'A favorite-team anchor. Two more games to follow.':isFinal()?'Three winning legs. Awaiting book confirmation.':'Two legs home. All eyes on the Tigers.'}</p><div class="ticket-progress" aria-label="${proposed?'No legs started':isFinal()?'Three winning legs':'Two winning legs, one still in play'}"><span class="${proposed?'':'done'}"></span><span class="${proposed?'':'done'}"></span><span class="${proposed?'':isFinal()?'done':'active'}"></span></div></div><div class="legs">${leg('Texas to win','Texas · Michigan',proposed?'Not started':'Final · Texas 28–17',!proposed,false)}${leg('Under 51.5 points','Alabama · Georgia',proposed?'Not started':'Final · 44 total points',!proposed,false)}${leg('LSU −3.5','LSU · Florida',proposed?'Needs LSU to win by 4 or more':isFinal()?'Final · LSU wins by 7':'Leading by 3 · not covering yet',isFinal(),!proposed&&!isFinal())}</div><div class="ticket-footer"><div class="row between"><div><div class="eyebrow">${proposed?'Illustrative return':isFinal()?'Expected return':'Potential return'}</div><div class="amount">${money(totalReturn(state.stake,state.odds))}</div></div><div style="text-align:right"><div class="small muted">${money(state.stake)} stake</div><div class="small" style="color:var(--gold)">${money(totalReturn(state.stake,state.odds)-state.stake)} ${isFinal()?'expected':'potential'} profit</div></div></div><p class="footnote">${proposed?'Sample combined odds. Actual sportsbook quote must be recorded.':isFinal()?'Game results shown. Payout has not been confirmed.':'Return includes stake. Final settlement follows the sportsbook’s rules.'}</p><button class="secondary full" style="margin-top:18px;border-color:#66583c" data-${proposed?'action="record"':compact?'page="tickets"':'page="room"'}>${proposed?'Review & record sample slip':compact?'Follow my ticket':'Watch the remaining game'} <span aria-hidden="true">↗</span></button></div></section>`;}
function leg(title,game,note,hit,live){return `<div class="leg"><span class="leg-mark ${hit?'hit':live?'live':''}" aria-hidden="true">${hit?'✓':live?'•':'○'}</span><div><div class="row between"><span class="leg-title">${title}</span><span class="small" style="color:${hit?'var(--lime)':'var(--gold)'}">${hit?'Won':live?'In play':'Upcoming'}</span></div><p>${game}</p><div class="leg-status">${note}</div></div></div>`;}
function budget(){return `<section class="card pad"><div class="row between"><h3>This week’s fun</h3><span class="badge gold">$50 LIMIT</span></div><div class="budget-track"><span style="width:${isPre()&&!state.recorded?0:state.stake/50*100}%"></span></div><div class="row between small"><span>${money(isPre()&&!state.recorded?0:state.stake)} recorded</span><span class="muted">${money(50-(isPre()&&!state.recorded?0:state.stake))} remaining</span></div><p class="footnote">Your existing weekly fun budget. Separate from the paper experiment.</p></section>`;}
function digest(){return `<section class="card pad"><div class="row between"><div><div class="eyebrow">The system’s side of the story</div><h2 style="margin-top:8px">${isPre()?'Before the whistle.':'While you were watching.'}</h2></div><span class="badge teal">PAPER</span></div>${state.exposure?`<div class="digest"><span class="event-icon" aria-hidden="true">↗</span><div><time>5:42 PM · Before kickoff</time><h3>Our LSU order got a paper fill.</h3><p class="muted">40 winner contracts at 58¢. The sharp consensus was 62¢ when we evaluated.</p><button class="link-button" data-action="system-story">Show me why →</button></div></div>`:`<div class="digest"><span class="event-icon" aria-hidden="true">—</span><div><time>5:42 PM · Before kickoff</time><h3>No paper position on LSU.</h3><p class="muted">It was evaluated. The recorded price gap didn’t clear fees and the required cushion.</p><button class="link-button" data-action="no-position">Why we passed →</button></div></div>`}<div class="digest"><span class="event-icon" aria-hidden="true">≈</span><div><time>5:51 PM · Before kickoff</time><h3>Passed on Florida’s spread.</h3><p class="muted">The sharp price was moving too quickly. The system recorded a pass.</p></div></div><div class="digest"><span class="event-icon" aria-hidden="true">${isFinal()?'✓':'◷'}</span><div><time>${isFinal()?'After the final whistle':isPre()?'Next · at kickoff':'At kickoff'}</time><h3>${isFinal()?'The game is final. Settlement is pending.':isPre()?'Trading closes before the game begins.':'Pregame work done. Following the result.'}</h3><p class="muted">${isFinal()?'Game result, paper settlement and sportsbook payout are tracked separately.':'This strategy places before kickoff. No new in-play orders.'}</p></div></div></section>`;}
function otherGames(){return `<section><div class="row between section-title"><h2 style="margin:0">On your radar</h2><span class="small muted">Your teams + ticket legs</span></div><div class="game-list"><button class="mini-game" data-action="saints"><div class="eyebrow">★ Your Saints · Sunday</div><div class="team-line"><span>New Orleans</span><span>NO</span></div><div class="team-line"><span>Atlanta</span><span>ATL</span></div><div class="mini-note">Tomorrow · 12:00 PM CT</div></button><button class="mini-game" data-action="texas"><div class="eyebrow">${isPre()?'On your sample ticket':'Your ticket · leg 1'}</div><div class="team-line"><span>Texas</span><span>${isPre()?'—':'28'}</span></div><div class="team-line"><span>Michigan</span><span>${isPre()?'—':'17'}</span></div><div class="mini-note">${isPre()?'Saturday · 11:00 AM CT':'Final · Texas leg won ✓'}</div></button></div></section>`;}
function controls(){return `<div class="demo-controls"><span>Explore system coverage:</span><button data-exposure="yes" class="${state.exposure?'chosen':''}" aria-pressed="${state.exposure}">With paper position</button><button data-exposure="no" class="${!state.exposure?'chosen':''}" aria-pressed="${!state.exposure}">No paper position</button><span>· Every value is fictional.</span></div>`;}
function today(){return pageTop(isPre()?'Make a day of it.':isFinal()?'The games end. The story stays.':'Good games. Your kind of Saturday.',isPre()?'A ticket to consider, your teams to follow, and the system getting ready.':isFinal()?'Revisit your ticket and see what the system can tell us so far.':'Your Tigers, your ticket, and a little context for every big moment.')+`<div class="layout"><div class="stack">${hero()}<div class="mobile-ticket">${ticketSlip(true)}</div>${digest()}${otherGames()}</div><aside class="stack"><div class="desktop-ticket">${ticketSlip(true)}</div>${budget()}<section class="card pad"><div class="eyebrow">A little more understanding</div><h2 style="margin-top:9px">The bet and the price.</h2><p class="muted small">Your ticket needs LSU to win by 4. ${state.exposure?"The system’s sample position needs an LSU win. Same game, different conditions.":"The system passed on this game. Your fun ticket still gives you a reason to follow."}</p><button class="link-button" data-action="different-bets">See the difference →</button></section></aside></div>`+controls();}
function exploreTickets(){return `<div class="ticket-layout"><section class="card pad"><div class="row between"><span class="badge gold">FOR YOUR SATURDAY</span><span class="small muted">DraftKings · sample quote</span></div><h2 class="feature-intro">Start with the Tigers.<br>Make three games matter.</h2><p class="muted">A three-game ticket built around LSU. Here’s the thinking behind each leg, and the tradeoffs worth seeing.</p><ul class="detail-list"><li><b>LSU −3.5</b> <span class="badge purple" style="margin-left:8px">YOUR TEAM</span><p>The personal anchor. A three-point win won’t be enough; LSU needs to win by at least four.</p></li><li><b>Texas to win</b><p>A different game and an earlier kickoff. The requirement is any Texas win.</p></li><li><b>Alabama–Georgia under 51.5</b><p>A total to follow: 51 combined points or fewer wins. Overtime and final grading follow the book’s terms.</p></li></ul><div class="explain">Why these legs? In the finished app, this explanation would cite recorded odds, game context and selection rules. This example demonstrates the layout.</div><div class="row" style="margin-top:22px;flex-wrap:wrap"><button class="primary" data-action="record">Review this sample ticket ↗</button><button class="secondary" data-action="compare">Compare a shorter ticket</button></div><p class="footnote">A proposed ticket is not a placed ticket. Confirm actual lines, odds and stake after placing by hand.</p></section><aside class="stack">${budget()}<section class="card pad"><div class="eyebrow">A ticket you understand</div><h2 style="margin-top:10px">Show the tradeoff.</h2><p class="muted">Compare leg count, quoted payout, game times and what each leg requires. Explain uncertainty in ordinary language.</p><div class="summary-grid"><div><b>3</b><span>different games</span></div><div><b>$25</b><span>sample stake</span></div><div><b>+600</b><span>sample odds</span></div></div><p class="footnote">No win probability is supplied in this concept. Correlated legs require an appropriate joint estimate.</p></section><section class="card pad"><div class="eyebrow">Sunday has your name on it</div><h2 style="margin-top:10px">A Saints ticket, next.</h2><p class="muted small">Favorite-team ideas belong here even when you haven’t picked a slip. Available budget stays visible.</p><button class="link-button" data-action="saints">Preview the Sunday idea →</button></section></aside></div>`;}
function tickets(){if(state.ticketKind==='sgp')return sgpTickets();const follow=state.ticketView==='follow';return pageTop('A little extra to root for.','Choose a ticket you understand. Follow every leg. Keep the story afterward.')+ticketKinds()+`<div class="ticket-nav"><button class="secondary ${!follow?'selected':''}" data-ticket-view="explore" aria-pressed="${!follow}">Find my ticket</button><button class="secondary ${follow?'selected':''}" data-ticket-view="follow" aria-pressed="${follow}">Follow my ticket</button></div>`+(follow?(isPre()&&!state.recorded?`<div class="empty-state"><div class="eyebrow">A clean slate</div><h2 style="margin-top:12px">Nothing placed yet.</h2><p>Explore an idea first. Your live ticket appears here after you record what you actually placed.</p><button class="primary" data-ticket-view="explore">Find my ticket →</button></div>`:`<div class="ticket-layout"><div>${ticketSlip()}</div><aside class="stack">${hero()}${budget()}</aside></div>`):exploreTickets());}
function positionCard(){return `<section class="card pad"><div class="row between"><h2>The system’s position</h2><span class="badge teal">PAPER</span></div>${state.exposure?`<p>LSU to win · YES</p><div class="summary-grid"><div><b>40</b><span>contracts filled</span></div><div><b>58¢</b><span>entry per contract</span></div><div><b>$23.40</b><span>cost including fees</span></div></div><div class="explain">${isFinal()?'The LSU win satisfies the sample contract. Paper settlement remains pending.':'Any LSU win satisfies this contract. Your parlay’s −3.5 spread has a different condition.'}</div><p class="footnote">Sample fill: $23.20 principal + $0.20 fees. $40 gross payout if YES settles.</p><button class="link-button" data-action="system-story">Inspect the recorded decision →</button>`:`<div class="explain">Evaluated and passed. The recorded price gap did not clear fees and the required cushion.</div><p class="footnote">An evaluated pass differs from a game the system never evaluated.</p><button class="link-button" data-action="no-position">Inspect the recorded pass →</button>`}</section>`;}
function room(){return pageTop('One game. Two stories.','Follow your ticket and understand the system’s position, side by side.')+`<button class="link-button back" data-page="today">← Back to your day</button><div class="room-layout"><div class="stack">${hero(true)}<section class="card pad"><div class="row between"><div><div class="eyebrow">Before kickoff · Sample prices</div><h2 style="margin-top:8px">What the system saw.</h2></div><button class="link-button" data-action="chart">Read this chart ↗</button></div><svg class="chart" viewBox="0 0 620 130" role="img" aria-label="Illustrative pregame price history: sharp consensus near 62 cents, venue ask reaching 58 cents. Not current in-play probabilities."><g stroke="#3a4437" stroke-width="1"><path d="M0 20H620M0 65H620M0 110H620"/></g><path d="M0 48L45 45 90 48 135 40 180 40 225 34 270 36 315 30 360 32 405 27 450 31 495 29 540 30 585 28 620 30" fill="none" stroke="#9bdbcd" stroke-width="2.5"/><path d="M0 73L45 73 90 69 135 74 180 81 225 81 270 87 315 78 360 81 405 90 450 85 495 89 540 91 585 89 620 89" fill="none" stroke="#f1c789" stroke-width="2.5"/>${state.exposure?'<path d="M495 10V120" stroke="#b7c9a2" stroke-dasharray="4 5"/><circle cx="495" cy="89" r="5" fill="#d8ed97"/>':''}</svg><div class="chart-labels"><span>5:00 PM</span><span>${state.exposure?"5:42 · Sample fill":"5:40 · Sample evaluation"}</span><span>6:00 PM</span></div><div class="row" style="margin-top:17px;font-size:11px;flex-wrap:wrap"><span style="color:var(--teal)">━ Sharp consensus</span><span style="color:var(--gold)">━ Venue ask</span><span class="muted">Pregame reference · cents</span></div><p class="footnote">${state.exposure?'Marker identifies the illustrative fill time.':'No position scenario: the chart is an illustrative reference, not evidence of a fill.'} Schematic only; no live probability is implied.</p></section></div><aside class="stack">${positionCard()}<section class="card pad"><div class="eyebrow">The decision trail · Sample evidence</div><h2 style="margin-top:8px">Every action has a reason.</h2><ol class="timeline"><li><time>5:39 PM</time><h3>Compared the same winner contract.</h3><p>Recorded venue price, sharp consensus and source timestamps.</p></li><li><time>5:40 PM</time><h3>${state.exposure?'Posted a paper order at 58¢.':'Passed on the available price.'}</h3><p>${state.exposure?'The recorded evaluation cleared its fee, freshness and risk checks.':'The recorded evaluation did not clear fees and the cushion.'}</p></li>${state.exposure?'<li><time>5:42 PM</time><h3>40 contracts filled in the simulator.</h3><p>A recorded trade supported the simulated fill. Expand for execution evidence.</p></li>':''}<li><time>${isFinal()?'After final':'At kickoff'}</time><h3>${isFinal()?'Result recorded. Settlement pending.':'Pregame trading window closed.'}</h3><p>${isFinal()?'A game win is an outcome; price quality and execution require separate evidence.':'Following the existing position and game result.'}</p></li></ol></section></aside></div>`+controls();}
function render(){document.querySelectorAll('[data-page]').forEach(b=>{if(b.closest('.nav')){b.classList.toggle('active',b.dataset.page===state.page);if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}});app.innerHTML=(state.notice?`<div class="notice" role="status">${state.notice}</div>`:'')+({today,tickets,room}[state.page])();}
function showDialog(title,body,kicker='A closer look'){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-kicker').textContent=kicker;document.getElementById('dialog-body').innerHTML=body;modal.showModal();}
function recordDialog(){showDialog('Record the slip you placed.',`<p class="muted small">Demo form for a future workflow. In the real app, place the ticket yourself, then record the sportsbook’s accepted stake, lines and combined odds here.</p><div class="explain">Sample legs: LSU −3.5 · Texas to win · Alabama–Georgia under 51.5</div><form id="record-form"><div class="input-group"><label for="stake">Actual stake · USD · sample weekly limit $50</label><input id="stake" name="stake" type="number" inputmode="decimal" min="0.01" max="50" step="0.01" value="25" required></div><div class="input-group"><label for="odds">Actual combined American odds</label><input id="odds" name="odds" type="number" inputmode="text" min="-100000" max="100000" step="1" value="600" required></div><div class="input-group row"><input id="lines" name="lines" type="checkbox" required style="width:20px;height:20px;flex-shrink:0"><label for="lines" style="margin:0;color:var(--text)">These are the sample lines on my slip.</label></div><p class="error" id="form-error" role="alert"></p><button type="submit" class="primary full">Save sample slip</button></form><p class="footnote">This changes temporary demo state only. Nothing is placed, submitted to a sportsbook, or saved to your system.</p>`,'PROTOTYPE · NO REAL MONEY');}
function ticketKinds(){return `<div class="ticket-nav" aria-label="Ticket type"><button class="secondary ${state.ticketKind==='across'?'selected':''}" data-ticket-kind="across" aria-pressed="${state.ticketKind==='across'}">Across games</button><button class="secondary ${state.ticketKind==='sgp'?'selected':''}" data-ticket-kind="sgp" aria-pressed="${state.ticketKind==='sgp'}">Same game + player props</button></div>`;}
const sgpCatalog=[
 {id:'win',title:'Saints to win',player:'New Orleans · game moneyline',reason:'Your favorite-team anchor. Requires a Saints win.',target:null},
 {id:'pass',title:'Avery Brooks · 225+ passing yards',player:'New Orleans · QB · fictional player',reason:'Passing production to follow. Passing yards can move together with a receiver’s yards.',target:225},
 {id:'rec',title:'Jordan Ellis · 50+ receiving yards',player:'New Orleans · WR · fictional player',reason:'A receiver leg connected to the quarterback leg. Those outcomes are related.',target:50},
 {id:'rush',title:'Casey Reed · 40+ rushing yards',player:'New Orleans · RB · fictional player',reason:'Rushing volume depends on game flow and player usage. It can change alongside the other legs.',target:40}
];
function sgpStats(){return isPre()?{pass:null,rec:null,rush:null}:isFinal()?{pass:247,rec:72,rush:54}:state.sgpFrame===1?{pass:220,rec:59,rush:39}:state.sgpFrame===2?{pass:216,rec:55,rush:39}:{pass:208,rec:47,rush:39};}
function sgpScore(){return `<section class="card hero"><div class="hero-top row between"><span class="badge gold">★ YOUR SAINTS</span><span class="small muted">${isPre()?'SUNDAY · SAMPLE':isFinal()?'FINAL · SAMPLE':'Q4 · 6:18 · SAMPLE'}</span></div><div class="scoreboard"><div><div class="crest" style="background:#554b34;border-color:#928262;color:#f0dfb5">NO</div><div class="team-name">Saints</div><div class="team-meta">New Orleans</div></div><div><div class="score">${isPre()?'vs':isFinal()?'28 : 24':'21 : 17'}</div><div class="clock">${isPre()?'12:00 PM CT':isFinal()?'GAME COMPLETE':'SAINTS POSSESSION'}</div></div><div><div class="crest fl" style="background:#512c2d;border-color:#825454;color:#e5b4b5">ATL</div><div class="team-name">Falcons</div><div class="team-meta">Atlanta</div></div></div><div class="hero-bottom"><div><div class="eyebrow">One game, ${state.sgpLegs.length} conditions</div><p>${isPre()?'Build around the game you want to watch.':isFinal()?'Game and player results ready. Book settlement pending.':'Your team and your players, in one place.'}</p></div></div></section>`;}
function propProgress(item){const value=sgpStats()[item.id];const reached=item.target!==null&&value!==null&&value>=item.target;let status=isPre()?'Upcoming':isFinal()?'Result met':item.target===null?'Leading':reached?'At target · provisional':'In play';const detail=item.target===null?(isPre()?'Any Saints win satisfies this leg.':isFinal()?'Saints won by 4. Awaiting book confirmation.':'Saints lead by 4. Needs to finish with a win.'):(isPre()?`Needs at least ${item.target} yards.`:`${value} yards · ${reached?'target reached, subject to corrections':Math.max(0,item.target-value)+' more to reach '+item.target}`);return `<div class="leg"><span class="leg-mark ${isFinal()?'hit':'live'}" aria-hidden="true">${isFinal()?'✓':isPre()?'○':'•'}</span><div><div class="leg-title">${item.title}</div><p>${item.player}</p><div class="row between" style="margin-top:11px"><span class="small" style="color:${reached?'var(--lime)':'var(--gold)'}">${status}</span>${item.target!==null?`<strong style="font-size:18px;font-variant-numeric:tabular-nums">${value===null?'—':value}<span class="small muted"> / ${item.target}</span></strong>`:''}</div>${item.target!==null?`<progress class="prop-progress" max="${item.target}" ${value===null?'value="0"':`value="${Math.min(item.target,value)}"`} aria-label="${item.title}: ${value===null?'not started':value+' yards, target '+item.target}"></progress>`:''}<div class="leg-status">${detail}</div></div></div>`;}
function sgpSlip(){const quote=state.sgpQuote;return `<section class="card ticket"><div class="ticket-head"><div class="row between"><span class="badge">SAME-GAME PARLAY</span><span class="small muted">${state.sgpLegs.length} legs · ${isPre()?'DRAFT':'SAMPLE SLIP'}</span></div><h2 class="ticket-title">Sunday belongs to New Orleans.</h2><p class="ticket-sub">${isPre()?'Your team. Your players. One ticket.':isFinal()?'Every sample result is met. Payout confirmation pending.':'Live stats beside the exact lines on your slip.'}</p></div><div class="legs">${state.sgpLegs.length?state.sgpLegs.map(id=>propProgress(sgpCatalog.find(x=>x.id===id))).join(''):'<p class="muted small" style="padding:20px 0">Choose at least two legs to begin.</p>'}</div><div class="ticket-footer">${quote===null?`<h3>Combined quote needed</h3><p class="ticket-sub">Related legs are priced together by the sportsbook. Record its accepted SGP odds to calculate your return.</p><button class="primary full" data-action="sgp-record" ${state.sgpLegs.length<2?'disabled':''}>Review & record sample slip ↗</button>`:`<div class="row between"><div><div class="eyebrow">${isFinal()?'Expected':'Potential'} return</div><div class="amount">${money(totalReturn(state.stake,quote))}</div></div><div style="text-align:right"><div class="small muted">${money(state.stake)} stake · ${oddsText(quote)}</div><div class="small" style="color:var(--gold)">${money(totalReturn(state.stake,quote)-state.stake)} ${isFinal()?'expected':'potential'} profit</div></div></div><p class="footnote">Recorded sample combined odds. Return includes stake. ${isFinal()?'Payout has not been confirmed.':'Live stats may be corrected; the sportsbook settles the slip.'}</p>`}<p class="footnote">Stat progress shows yards toward a line. It is not a percentage chance of winning.</p></div></section>`;}
function sgpBuilder(){return `<section class="card pad"><div class="row between"><span class="badge gold">BUILD YOUR SUNDAY</span><span class="small muted">Fictional player catalog</span></div><h2 class="feature-intro">Pick the game.<br>Find your story inside it.</h2><p class="muted">Choose team and player legs, understand their relationship, then check the sportsbook’s combined quote.</p><div class="sgp-catalog">${sgpCatalog.map(item=>`<div class="sgp-option"><div><h3>${item.title}</h3><p class="small muted">${item.player}</p><p class="small muted">${item.reason}</p></div><button class="${state.sgpLegs.includes(item.id)?'primary':'secondary'}" data-sgp-leg="${item.id}" aria-label="${state.sgpLegs.includes(item.id)?'Remove':'Add'} ${item.title}" aria-pressed="${state.sgpLegs.includes(item.id)}">${state.sgpLegs.includes(item.id)?'✓ Added':'+ Add'}</button></div>`).join('')}</div><div class="explain"><b>How these legs relate</b><p style="margin:7px 0 0">${state.sgpLegs.includes('pass')&&state.sgpLegs.includes('rec')?'A completed pass to Ellis adds to both Brooks’s passing yards and Ellis’s receiving yards. Their chances cannot be multiplied as independent events.':'Legs in this game can share game-flow and player-usage effects. The sportsbook decides which combinations it accepts and how it prices them.'}</p></div><p class="footnote">Catalog is illustrative. The finished app needs verified market availability and player identity. No combination is represented as sportsbook-approved until confirmed.</p></section>`;}
function sgpLiveContext(){return `<section class="card pad"><div class="eyebrow">${isFinal()?'A record worth keeping':'What changed on that play'}</div><h2 style="margin-top:9px">${isFinal()?'The last whistle isn’t the last check.':state.sgpFrame===2?'A stat correction, shown clearly.':state.sgpFrame===1?'One completion. Two legs move.':'Your ticket, play by play.'}</h2><p class="muted">${isFinal()?'The sample final is Saints 28–24, with Brooks at 247 passing yards and Ellis at 72 receiving yards. The app still waits for confirmed sportsbook settlement.':state.sgpFrame===2?'The sample completion was corrected from 12 yards to 8. Brooks now has 216 passing yards; Ellis has 55 receiving yards. Both progress bars move back.':state.sgpFrame===1?'Brooks completes a 12-yard pass to Ellis. Passing yards move from 208 to 220; receiving yards move from 47 to 59. Ellis is above the target, provisionally.':'Brooks has 208 passing yards; Ellis has 47 receiving yards. Try the next sample play to see how a single event affects both legs.'}</p>${!isFinal()?`<div class="row" style="flex-wrap:wrap;margin-top:18px"><button class="primary" data-action="sgp-next" ${state.sgpFrame===1?'disabled':''}>Next sample play +12 yd</button><button class="secondary" data-action="sgp-correction" ${state.sgpFrame!==1?'disabled':''}>Apply stat correction</button><button class="link-button" data-action="sgp-reset">Reset example</button></div>`:''}<p class="footnote">Fictional stats. Progress can decrease through negative plays or corrections. Meeting a live target is provisional.</p></section>`;}
function sgpTickets(){return pageTop(isPre()?'Make the game your own.':'Every yard has a little more meaning.',isPre()?'Game lines and player props, with a clear explanation of how the legs connect.':'Follow the team, the players, and the exact conditions on your same-game ticket.')+ticketKinds()+`<div class="ticket-layout"><div class="stack">${isPre()?sgpBuilder():sgpScore()}${!isPre()?`<div class="mobile-ticket">${sgpSlip()}</div>`:''}${isPre()?sgpScore():sgpLiveContext()}${!isPre()?`<section class="card pad"><div class="eyebrow">Live feed behavior · To implement</div><h2 style="margin-top:9px">An honest view of the stats.</h2><p class="muted small">Updated player totals carry their source and observation time. Missing stats stay unavailable. Corrections are visible, and a sportsbook settlement is a separate event.</p></section>`:''}</div><aside class="stack"><div class="${isPre()?'':'desktop-ticket'}">${sgpSlip()}</div>${budget()}</aside></div>`;}
function sgpRecordDialog(){showDialog('Record the sportsbook’s SGP quote.',`<p class="muted small">These legs share one game. Use the actual accepted combined odds after placing by hand.</p><ul class="detail-list">${state.sgpLegs.map(id=>`<li>${sgpCatalog.find(x=>x.id===id).title}</li>`).join('')}</ul><form id="record-form"><input type="hidden" name="ticket-kind" value="sgp"><div class="input-group"><label for="stake">Actual stake · USD · sample weekly limit $50</label><input id="stake" name="stake" type="number" inputmode="decimal" min="0.01" max="50" step="0.01" value="25" required></div><div class="input-group"><label for="odds">Sportsbook’s accepted combined American odds</label><input id="odds" name="odds" type="number" inputmode="text" min="-100000" max="100000" step="1" placeholder="For example, +450" required></div><div class="input-group row"><input id="lines" name="lines" type="checkbox" required style="width:20px;height:20px;flex-shrink:0"><label for="lines" style="margin:0;color:var(--text)">These sample players, lines and legs match the accepted slip.</label></div><p class="error" id="form-error" role="alert"></p><button class="primary full" type="submit">Save sample SGP & follow it</button></form><p class="footnote">Temporary demo state only. No real wager, quote request or account write occurs.</p>`,'SAME-GAME PARLAY · SAMPLE RECORD');}
const sgpStyles=document.createElement('style');
sgpStyles.textContent='.sgp-option{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:19px 0;border-bottom:1px solid var(--line)}.sgp-option>div{min-width:0}.sgp-option button{flex-shrink:0;min-width:77px;padding:10px}.sgp-option p{margin:6px 0 0}.prop-progress{appearance:none;display:block;width:100%;height:6px;border:none;border-radius:5px;overflow:hidden;margin:9px 0;background:#504b36}.prop-progress::-webkit-progress-bar{background:#504b36}.prop-progress::-webkit-progress-value{background:var(--gold)}.prop-progress::-moz-progress-bar{background:var(--gold)}@media(max-width:760px){.sgp-option{gap:12px}.sgp-option h3{font-size:14px}.sgp-option button{min-width:70px;font-size:12px}}';
document.head.appendChild(sgpStyles);
const dialogs={
 'system':()=>showDialog('Quiet when it’s working.',`<p>The home screen keeps a concise system status within reach. This expanded view would explain any interruption and which games or results it affects.</p><ul class="detail-list"><li><b>Paper experiment</b><p>Sample recorder and price feed healthy. No real venue orders.</p></li><li><b>Game context</b><p>Sample score, clock and possession. Production will show receipt time and provider freshness independently.</p></li><li><b>Research & operations</b><p>Study, gate checks and detailed diagnostics remain available in the full design. This prototype explores the watching and ticket journeys.</p></li></ul>`,'SYSTEM · SAMPLE STATUS'),
 'sync':()=>showDialog('Keep the touchdown on your TV.',`<p>A proposed TV-sync control would hold scores, plays, ticket status, prices and related notifications behind one consistent display cutoff.</p><p class="muted">We should decide whether you want a simple delay slider, a pause button, or no spoiler protection. The concept does not implement playback buffering.</p><p class="footnote">The actual system keeps recording normally. Operational alerts remain visible.</p>`,'INTERACTION TO DISCUSS'),
 'why-leg':()=>showDialog('LSU needs to win by at least 4.',`<p>Your sample leg is <b>LSU −3.5</b>.</p><ul class="detail-list"><li>LSU wins by 3 → the leg loses.</li><li>LSU wins by 4 or more → the leg wins.</li><li>A lead during the game → the leg is still unsettled.</li></ul><p class="footnote">Game cancellation, voids and other exceptions follow the sportsbook’s rules.</p>`,'YOUR TICKET · EXACT CONDITION'),
 'different-bets':()=>showDialog('Same team. Different conditions.',`<ul class="detail-list"><li><b>Fun ticket: LSU −3.5</b><p>Needs an LSU win by at least four points.</p></li><li><b>Paper position: LSU winner, YES</b><p>Needs an LSU win. A three-point victory can satisfy this contract while losing your parlay leg.</p></li></ul><p class="footnote">Separate accounting and settlement. The home screen can connect their game stories without adding their balances together.</p>`),
 'system-story':()=>showDialog('From a price to a paper fill.',`<p>Illustrative record for the LSU winner contract:</p><ul class="detail-list"><li><b>62¢ sharp consensus · 58¢ order price</b><p>These are pregame values from the sample evaluation.</p></li><li><b>40 paper contracts filled at 5:42 PM</b><p>$23.20 principal plus $0.20 sample fees. A real implementation links to order, fill, source and correction records.</p></li><li><b>What this does—and doesn’t—tell us</b><p>The event explains an action. Whether it was a good entry depends on closing-price evidence; whether it was a credible fill depends on execution evidence.</p></li></ul>`,'WHY THE SYSTEM ACTED · SAMPLE'),
 'no-position':()=>showDialog('A pass is part of the story.',`<p>In this scenario, LSU was evaluated and the recorded gap did not clear the fee and cushion checks.</p><p class="muted">The full app must also distinguish “not evaluated,” “data unavailable” and “evaluation incomplete.” None of those means the system chose to pass.</p>`,'NO PAPER POSITION · SAMPLE'),
 'chart':()=>showDialog('Prices at the time of the decision.',`<p>Teal represents sharp consensus. Gold represents the venue’s asking price. ${state.exposure?"The vertical marker is the illustrative fill time.":"This scenario has no fill marker because the system passed."}</p><p class="muted">The finished chart would use exact contract and side mappings, labeled values on hover or tap, and visible gaps. This schematic is a pregame reference, not an in-play valuation.</p>`),
 'compare':()=>showDialog('Make the tradeoff easy to see.',`<p>A comparison view could place a shorter ticket beside the three-leg idea:</p><ul class="detail-list"><li><b>LSU −3.5 + Texas to win</b><p>Two conditions. Two games to follow. Needs a fresh combined quote from the book.</p></li><li><b>Add Alabama–Georgia under 51.5</b><p>A third condition must also hold. Show the new quoted payout and explain the extra requirement.</p></li></ul><p class="footnote">A shorter-ticket comparison is proposed scope. The existing builder currently uses 3–4 legs for its smart card.</p>`,'TICKET COMPARISON · PROPOSED'),
 'saints':()=>showDialog('Your Sunday starts here.',`<p>New Orleans–Atlanta is a fictional Sunday fixture in this concept.</p><p class="muted">The personal hub would collect kickoff, team context, weather where relevant, and Saints-anchored ticket ideas. An unavailable quote is shown as unavailable.</p>`,'YOUR SAINTS · SAMPLE'),
 'texas':()=>showDialog(isPre()?'Texas to win.':'One leg, home.',`<p>${isPre()?'The sample ticket needs any Texas win.':'In the fictional result, Texas beat Michigan 28–17, satisfying this moneyline leg.'}</p><p class="muted">Each leg opens its own game room in the finished app. This prototype’s complete game-room example is LSU–Florida.</p>`,'YOUR TICKET · SAMPLE LEG')
};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.ticketKind){state.ticketKind=b.dataset.ticketKind;state.page='tickets';state.notice='';render();return;}if(b.dataset.sgpLeg){const key=b.dataset.sgpLeg;if(state.sgpLegs.includes(key))state.sgpLegs=state.sgpLegs.filter(x=>x!==key);else state.sgpLegs.push(key);state.sgpQuote=null;render();return;}if(b.dataset.page){state.page=b.dataset.page;state.notice='';render();window.scrollTo({top:0,behavior:'instant'});app.focus({preventScroll:true});return;}if(b.dataset.stage){state.stage=b.dataset.stage;state.sgpQuote=state.stage==='pregame'||state.sgpLegs.join(',')!=='win,pass,rec'?null:450;state.sgpFrame=0;state.recorded=false;state.stake=25;state.odds=600;state.notice='';state.ticketView=isPre()?'explore':'follow';render();return;}if(b.dataset.ticketView){state.ticketView=b.dataset.ticketView;if(state.ticketView==='explore'&&!isPre()){state.stage='pregame';state.recorded=false;state.stake=25;state.odds=600;state.notice='Demo switched to before games to explore an unplaced ticket.';}render();return;}if(b.dataset.exposure){state.exposure=b.dataset.exposure==='yes';render();return;}const a=b.dataset.action;if(a==='close')modal.close();else if(a==='record')recordDialog();else if(a==='sgp-record')sgpRecordDialog();else if(a==='sgp-next'){state.sgpFrame=1;render();}else if(a==='sgp-correction'){state.sgpFrame=2;render();}else if(a==='sgp-reset'){state.sgpFrame=0;render();}else if(dialogs[a])dialogs[a]();});
document.addEventListener('submit',e=>{if(e.target.id!=='record-form')return;e.preventDefault();const form=new FormData(e.target);const stake=Number(form.get('stake')),odds=Number(form.get('odds'));if(!Number.isFinite(stake)||stake<=0||stake>50||!Number.isInteger(odds)||Math.abs(odds)<100||Math.abs(odds)>100000){document.getElementById('form-error').textContent='Use a stake above $0 and at most $50, and integer American odds of +100 or greater, or −100 or lower.';return;}state.stake=stake;state.odds=odds;if(form.get('ticket-kind')==='sgp'){state.ticketKind='sgp';state.sgpQuote=odds;}state.recorded=true;state.stage='live';state.ticketView='follow';state.page='tickets';state.notice='Sample slip recorded locally. Jumped ahead to the live-game example so you can follow it.';modal.close();render();window.scrollTo({top:0,behavior:'instant'});app.focus({preventScroll:true});});
// Alternate art direction. Uses the same fictional ticket and game state as concept one.
document.title='Harness — Broadcast / Desk comparison';
document.querySelector('.brand').textContent='HARNESS';
const lookControls=document.createElement('div');
lookControls.className='look-controls';
lookControls.setAttribute('role','group');lookControls.setAttribute('aria-label','Compare visual directions');
lookControls.innerHTML='<button data-look="broadcast" aria-pressed="true">Broadcast</button><button data-look="desk" aria-pressed="false">Dense desk</button>';
document.querySelector('header').insertBefore(lookControls,document.querySelector('.system-button'));
function setLook(look){document.documentElement.dataset.look=look;document.querySelectorAll('[data-look]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',b.dataset.look===look);});}
setLook(location.hash==='#desk'?'desk':'broadcast');
document.addEventListener('click',e=>{const b=e.target.closest('button[data-look]');if(b)setLook(b.dataset.look);});
pageTop=function(_title,_sub){return `<div class="topline"><div><div class="eyebrow">${state.page==='today'?'NFL / COLLEGE · CENTRAL TIME':state.page==='room'?'LSU / FLORIDA · SAMPLE GAME':'DRAFTKINGS · FUN TICKETS'}</div><h1>${state.page==='today'?'GAME DAY':state.page==='room'?'GAME ROOM':state.ticketKind==='sgp'?'SAME-GAME PARLAY':'TICKET DESK'}</h1><p class="muted standfirst">${state.page==='today'?'Your games. Your tickets. The system’s record.':'Game lines, player props and the exact terms on your slip.'}</p></div>${stageButtons()}</div>`;};
function scoreStrip(){return `<section class="score-strip" aria-label="Sample scoreboard"><button class="strip-game selected" data-page="room"><span class="strip-time">${isPre()?'6:30 PM CT':isFinal()?'Final':'Q4 8:42'} · On your ticket</span><b>LSU</b><strong>${isPre()?'—':isFinal()?'31':'24'}</strong><b>Florida</b><strong>${isPre()?'—':isFinal()?'24':'21'}</strong></button><button class="strip-game" data-action="texas"><span class="strip-time">${isPre()?'11:00 AM CT':'Final'} · On your ticket</span><b>Texas</b><strong>${isPre()?'—':'28'}</strong><b>Michigan</b><strong>${isPre()?'—':'17'}</strong></button><button class="strip-game" data-action="bama"><span class="strip-time">${isPre()?'2:30 PM CT':'Final'} · On your ticket</span><b>Alabama</b><strong>${isPre()?'—':'24'}</strong><b>Georgia</b><strong>${isPre()?'—':'20'}</strong></button><button class="strip-game" data-action="saints"><span class="strip-time">Sunday · 12:00 PM CT</span><b>Saints</b><strong>—</strong><b>Falcons</b><strong>—</strong></button></section>`;}
function broadcastRail(){return `<aside class="broadcast-col broadcast-rail"><section class="card"><h2 class="rail-heading">WATCH LIST</h2><div class="rail-row"><div class="row between"><b>LSU −3.5</b><span style="color:var(--gold)">${isPre()?'Upcoming':isFinal()?'Won':'In play'}</span></div><p>${isPre()?'Needs LSU by 4+':isFinal()?'Final margin +7':'Current margin +3 · needs +4'}</p><button class="link-button" data-page="room">Game detail →</button></div><div class="rail-row"><div class="row between"><b>Texas ML</b><span>${isPre()?'Upcoming':'Won'}</span></div><p>${isPre()?'Needs any Texas win':'Final · Texas by 11'}</p></div><div class="rail-row"><div class="row between"><b>ALA / UGA U51.5</b><span>${isPre()?'Upcoming':'Won'}</span></div><p>${isPre()?'Needs 51 points or fewer':'Final · 44 combined points'}</p></div><div class="rail-row"><div class="row between"><b>New Orleans</b><span>Sunday</span></div><p>Same-game + player props</p><button class="link-button" data-ticket-kind="sgp">Open SGP example →</button></div></section><section class="card"><h2 class="rail-heading">PAPER ACCOUNT</h2><div class="rail-row"><div class="rail-label">This game · recorded cost</div><div class="rail-value">${state.exposure?'$23.40':'$0.00'}</div><p>${state.exposure?'40 YES contracts · includes $0.20 fees':'Evaluated pass · no position'}</p></div><div class="rail-row"><div class="row between"><span>Mode</span><b>PAPER</b></div><p>Pregame strategy. Results and execution reviewed separately.</p></div><div class="rail-row"><button class="link-button" data-action="system">Health & research →</button></div></section></aside>`;}
function activityTape(){return `<section class="card activity-block"><div class="broadcast-title"><h2>DECISION TAPE</h2><span class="badge teal">PAPER · SAMPLE</span></div><table class="tape"><thead><tr><th>Time CT</th><th>Action / recorded reason</th><th>Detail</th></tr></thead><tbody><tr><td><time>5:42 PM</time></td><td><span class="action-label">${state.exposure?'FILLED':'PASSED'}</span><br><b>LSU winner · YES</b><p>${state.exposure?'40 contracts at 58¢. Sharp reference 62¢ at evaluation.':'Recorded gap did not clear fees and the required cushion.'}</p></td><td><button class="link-button" data-action="${state.exposure?'system-story':'no-position'}">Why ↗</button></td></tr><tr><td><time>5:51 PM</time></td><td><span class="action-label">PASSED</span><br><b>Florida spread</b><p>Sharp price moving too quickly. No order placed.</p></td><td><span class="muted">—</span></td></tr><tr><td><time>${isFinal()?'Final':isPre()?'Next':'Kickoff'}</time></td><td><span class="action-label">${isFinal()?'RESULT':'WINDOW'}</span><br><b>${isFinal()?'LSU win recorded':isPre()?'Trading closes before kickoff':'Pregame trading closed'}</b><p>${isFinal()?'Paper settlement pending. A game result is not a settled ledger entry.':'This strategy places before kickoff; the game view follows the outcome.'}</p></td><td><button class="link-button" data-page="room">Game ↗</button></td></tr></tbody></table><div class="broadcast-note">Fictional records for design review. Production details link to source prices, orders and fills.</div></section>`;}
today=function(){return pageTop()+scoreStrip()+`<div class="broadcast-grid">${broadcastRail()}<div class="broadcast-col broadcast-main">${hero()}<div class="mini-metrics"><div><b>${state.exposure?'40':'0'}</b><span>Paper contracts</span></div><div><b>${state.exposure?'58¢':'—'}</b><span>Entry per contract</span></div><div><b>${isPre()?'0 / 3':isFinal()?'3 / 3':'2 / 3'}</b><span>Ticket results met</span></div></div>${activityTape()}<section class="card desk-only"><div class="broadcast-title"><h2>ENTRY REFERENCE</h2><span class="badge">BEFORE KICKOFF</span></div><table class="tape"><thead><tr><th>Contract</th><th>Sharp reference</th><th>Paper entry</th><th>Settlement</th></tr></thead><tbody><tr><td>LSU winner YES</td><td>${state.exposure?'62¢':'—'}</td><td>${state.exposure?'58¢':'No position'}</td><td>${state.exposure?'Pending':'—'}</td></tr></tbody></table><div class="broadcast-note">Decision-time reference, not an in-play probability or executable exit price.</div></section></div><aside class="broadcast-col broadcast-tickets">${ticketSlip(true)}${budget()}<section class="card"><div class="rail-row"><div class="rail-label">PLAYER PROPS + SAME-GAME</div><p>Try a completion that moves two legs, then a stat correction.</p><button class="link-button" data-ticket-kind="sgp">Open Saints SGP →</button></div></section></aside></div>`+controls();};
dialogs.bama=()=>showDialog('Alabama / Georgia · Under 51.5',`<p>${isPre()?'The sample ticket needs a combined final score of 51 points or fewer.':'The fictional final is Alabama 24, Georgia 20: 44 combined points, satisfying the under leg.'}</p><p class="muted small">Actual grading follows the recorded sportsbook terms.</p>`,'SAMPLE TICKET LEG');

if(location.hash==='#sgp'){state.page='tickets';state.ticketKind='sgp';}
render();
</script>
