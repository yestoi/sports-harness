# Alembic's file-based configuration. `harness migrate ...` never reads it: harness/db/migrate.py
# builds an equivalent Config in code so the commands work with no `alembic` binary on PATH and
# no cwd assumption. This file exists so that `alembic` on a developer's machine finds the same
# script directory, and it ships in the image beside migrations/ (two COPY lines in the
# Dockerfile, never one).
[alembic]
script_location = migrations
prepend_sys_path = .
# os.pathsep for prepend_sys_path; without it Alembic warns and splits on spaces too.
path_separator = os
# No sqlalchemy.url: the URL comes from Settings.database_url through harness/db/migrate.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
