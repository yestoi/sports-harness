[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "apscheduler>=3.10,<4",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "python-json-logger>=2.0",
  "typer>=0.12",
  "pyyaml>=6",
  "cryptography>=42",
  "alembic>=1.16",
  "websocket-client>=1.8",
  "jinja2>=3.1",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30", "freezegun>=1.5", "respx>=0.21"]

[project.scripts]
harness = "harness.cli:app"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = [
  "matching/*.yaml",
  "pricing/*.yaml",
  "variants/*.yaml",
  "dashboard/templates/*.html",
  # Phase 4.5. An explicit list, not a recursive glob: the byte budget and the no-external-URL
  # test are per-file guarantees, and a glob would quietly ship whatever landed in the tree.
  "dashboard/static/*",
  "dashboard/static/js/*",
  "dashboard/static/vendor/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:starlette.*",
  "ignore::starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
]
