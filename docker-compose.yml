services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # Tuned for the NAS (7 GB RAM shared with the media stack, 8 cores) ingesting up to 4M
    # orderbook rows/hour; image defaults were checkpointing too rarely, forcing backend-driven
    # dirty page flushes. Roadmap carried fix 9 (finding F19 tuning / R17).
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - autovacuum_vacuum_cost_limit=1000
      - -c
      - random_page_cost=1.1
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app-backup:
    image: postgres:16
    user: "${APP_UID:-65534}:${APP_GID:-65534}"
    # The postgres image is the only place pg_dump 16 exists; the app image has none and gains
    # no packages (D2). This service holds no secret beyond PGPASSWORD, which is the same
    # value the SQLAlchemy URL in .env already carries (A-I2: libpq cannot parse that URL).
    command: ["/backup/loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: harness
      PGDATABASE: harness
      PGPASSWORD: harness
      TZ: UTC
    volumes:
      - ./deploy/backup:/backup:ro
      - ./backups:/backups:rw
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 300s

  app-run:
    build: .
    user: "${APP_UID:-65534}:${APP_GID:-65534}"
    command: ["run"]
    env_file: .env
    environment:
      ODDS_API_KEY_FILE: /run/secrets/odds_api_key
      # C2: the scheduled limits read needs the production key files here exactly as app-ws
      # already has them. Without these, has_kalshi_credentials() is False in the recorder
      # container and no venue_requests row is ever written in production. Both key files are
      # read-scoped and the transport the recorder builds has writes_enabled=False, so this
      # adds a signed GET capability and nothing else.
      KALSHI_KEY_ID_FILE: /run/secrets/kalshi_key_id
      KALSHI_PRIVATE_KEY_FILE: /run/secrets/kalshi_private_key.pem
    volumes:
      - ./secrets/odds_api_key:/run/secrets/odds_api_key:ro
      # Task 12b: os.statvfs only, for host.disk_free_gb (design spec §3.1). Read-only, and
      # never mounted into app-exec: the executor has no volumes at all, deliberately.
      - ./pgdata:/pgdata-ro:ro
      # The backup encrypt job runs inside app-run: it reads the sidecar's plaintexts, writes
      # the ciphertexts and markers beside them, and needs the public recipient. The age
      # *private* key is never on the NAS, so a ciphertext here cannot be decrypted here.
      - ./backups:/backups:rw
      - ./deploy/backup_age.pub:/run/backup_age.pub:ro
      - ./secrets/kalshi_key_id:/run/secrets/kalshi_key_id:ro
      - ./secrets/kalshi_private_key.pem:/run/secrets/kalshi_private_key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 120s

  app-serve:
    build: .
    user: "${APP_UID:-65534}:${APP_GID:-65534}"
    command: ["serve", "--port", "8080"]
    env_file: .env
    environment:
      ODDS_API_KEY_FILE: /run/secrets/odds_api_key
      DASHBOARD_TOKEN_FILE: /run/secrets/dashboard_token
    volumes:
      - ./secrets/odds_api_key:/run/secrets/odds_api_key:ro
      - ./secrets/dashboard_token:/run/secrets/dashboard_token:ro
    ports:
      - "127.0.0.1:${SERVE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /healthz answers 503 when the recorder is stale or errored, which marks the
      # container unhealthy. That is intended: it is the signal an external monitor reads.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 120s

  # Phase 4.6 (addendum §6, roadmap U9): the one home-network listener, behind the owner
  # login. Same image and same user as `app-serve`; everything that differs is written out
  # here rather than hidden behind a YAML anchor, so every mount, variable and port of a
  # host-exposed service is visible in one place (A-I10).
  #
  # `profiles: ["lan"]` is the switch. Compose starts this service only when the runtime
  # `.env` carries `COMPOSE_PROFILES=lan`, and `scripts/release-omarchy.py::lan_active()`
  # writes that line only when the user's three files are non-empty regular files on the
  # host. A host without them runs exactly today's stack, and the loopback `app-serve` and
  # the recorder `app-ws` are untouched either way.
  #
  # The published address is `${LAN_ADDR}` and never `0.0.0.0`: Docker publishes ahead of
  # ufw, so this binding -- not the firewall -- is what keeps the listener off the WireGuard
  # and Docker interfaces (roadmap 4.6 item 4). Inside the container the process still binds
  # 0.0.0.0, exactly as `app-serve` does; the boundary is the host side of the mapping.
  app-serve-lan:
    build: .
    user: "${APP_UID:-65534}:${APP_GID:-65534}"
    # TLS is not optional here: `serve --lan` exits 2 unless both files are non-empty regular
    # files, so a missing bind source can never downgrade this listener to plaintext.
    command: ["serve", "--port", "8443", "--lan",
              "--tls-cert", "/run/secrets/lan_tls.crt",
              "--tls-key", "/run/secrets/lan_tls.key"]
    env_file: .env
    environment:
      DASHBOARD_TOKEN_FILE: /run/secrets/dashboard_token
      # Where Compose publishes this listener, and the only Origin the write routes accept
      # (design §5.5: from settings, never from the request's Host). The defaults match
      # deploy/omarchy/host.env, so a runtime .env without them behaves identically.
      LAN_ADDR: "${LAN_ADDR:-192.168.12.127}"
      LAN_PORT: "${LAN_PORT:-8443}"
      # The four posture variables the release validator requires, pinned on the service
      # itself: this is the one container reachable from another machine, so its paper
      # posture is stated here and does not depend on what the runtime env file says.
      LIVE_TRADING: "0"
      HARNESS_MODE: paper
      DB_BUDGET_GB: "600"
      RFQ_LISTENER_ENABLED: "0"
    # Four read-only files and no Odds key: this container serves the dashboard and places no
    # market read of its own. The three LAN files are the user's (D7) -- nothing in the loop
    # creates, copies or reads them; Compose only binds them.
    volumes:
      - ./secrets/dashboard_token:/run/secrets/dashboard_token:ro
      - ./secrets/owner_password_hash:/run/secrets/owner_password_hash:ro
      - ./secrets/lan_tls.crt:/run/secrets/lan_tls.crt:ro
      - ./secrets/lan_tls.key:/run/secrets/lan_tls.key:ro
    ports:
      - "${LAN_ADDR:-192.168.12.127}:${LAN_PORT:-8443}:8443"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The certificate is self-signed by design, so the probe uses an unverified context:
      # this asks whether the listener is alive, not whether a CA vouches for it. /healthz is
      # the one route the owner login exempts, so no session is involved. The explicit
      # `status==200` is app-serve's form: a 503 (stale recorder) then marks the container
      # unhealthy through an exit code instead of an unhandled HTTPError traceback in the
      # health log on every probe.
      test: ["CMD-SHELL", "python -c \"import ssl,urllib.request,sys; sys.exit(0 if urllib.request.urlopen('https://127.0.0.1:8443/healthz', context=ssl._create_unverified_context(), timeout=5).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 120s
    profiles: ["lan"]

  app-ws:
    build: .
    user: "${APP_UID:-65534}:${APP_GID:-65534}"
    command: ["ws-record"]
    env_file: .env
    environment:
      ODDS_API_KEY_FILE: /run/secrets/odds_api_key
      KALSHI_KEY_ID_FILE: /run/secrets/kalshi_key_id
      KALSHI_PRIVATE_KEY_FILE: /run/secrets/kalshi_private_key.pem
    volumes:
      - ./secrets/odds_api_key:/run/secrets/odds_api_key:ro
      - ./secrets/kalshi_key_id:/run/secrets/kalshi_key_id:ro
      - ./secrets/kalshi_private_key.pem:/run/secrets/kalshi_private_key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    stop_grace_period: 30s

  app-exec:
    build: .
    user: "${APP_UID:-65534}:${APP_GID:-65534}"
    command: ["exec"]
    env_file: .env
    # No volumes and no credential environment, deliberately: the paper executor has no venue
    # client, so there is nothing here that could send an order even if the code changed.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "harness exec-health"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 60s

  app-research:
    build: .
    user: "${APP_UID:-65534}:${APP_GID:-65534}"
    command: ["research-worker"]
    env_file: .env
    # Ruling A-M2: this container mounts the Anthropic key and NOTHING else. No Kalshi key, no
    # Odds key, no pgdata. It is the one process in the stack that talks to a paid model API,
    # so it is also the one process with no venue credential in it -- a compromise here can
    # spend money against the U4 caps and can reach no exchange at all.
    #
    # No ports: it serves nothing. `restart: unless-stopped` because a dormant worker (no key)
    # is a normal state, not a failure, and it must come back up with the stack.
    volumes:
      - ./secrets/anthropic_api_key:/run/secrets/anthropic_api_key:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
