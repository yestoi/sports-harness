services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # Tuned for the NAS (7 GB RAM shared with the media stack, 8 cores) ingesting up to 4M
    # orderbook rows/hour; image defaults were checkpointing too rarely, forcing backend-driven
    # dirty page flushes. Roadmap carried fix 9 (finding F19 tuning / R17).
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - autovacuum_vacuum_cost_limit=1000
      - -c
      - random_page_cost=1.1
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app-run:
    build: .
    user: "${APP_UID:-65534}:${APP_GID:-65534}"
    command: ["run"]
    env_file: .env
    environment:
      ODDS_API_KEY_FILE: /run/secrets/odds_api_key
    volumes:
      - ./secrets/odds_api_key:/run/secrets/odds_api_key:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 120s

  app-serve:
    build: .
    user: "${APP_UID:-65534}:${APP_GID:-65534}"
    command: ["serve", "--port", "8080"]
    env_file: .env
    environment:
      ODDS_API_KEY_FILE: /run/secrets/odds_api_key
      DASHBOARD_TOKEN_FILE: /run/secrets/dashboard_token
    volumes:
      - ./secrets/odds_api_key:/run/secrets/odds_api_key:ro
      - ./secrets/dashboard_token:/run/secrets/dashboard_token:ro
    ports:
      - "127.0.0.1:${SERVE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /healthz answers 503 when the recorder is stale or errored, which marks the
      # container unhealthy. That is intended: it is the signal an external monitor reads.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 120s

  app-ws:
    build: .
    user: "${APP_UID:-65534}:${APP_GID:-65534}"
    command: ["ws-record"]
    env_file: .env
    environment:
      ODDS_API_KEY_FILE: /run/secrets/odds_api_key
      KALSHI_KEY_ID_FILE: /run/secrets/kalshi_key_id
      KALSHI_PRIVATE_KEY_FILE: /run/secrets/kalshi_private_key.pem
    volumes:
      - ./secrets/odds_api_key:/run/secrets/odds_api_key:ro
      - ./secrets/kalshi_key_id:/run/secrets/kalshi_key_id:ro
      - ./secrets/kalshi_private_key.pem:/run/secrets/kalshi_private_key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    stop_grace_period: 30s

  app-exec:
    build: .
    user: "${APP_UID:-65534}:${APP_GID:-65534}"
    command: ["exec"]
    env_file: .env
    # No volumes and no credential environment, deliberately: the paper executor has no venue
    # client, so there is nothing here that could send an order even if the code changed.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "harness exec-health"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 60s
